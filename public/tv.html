<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الطلبات — Unify ERP</title>
<link rel="icon" type="image/png" href="/logos/amwali-mark-white.png?v=amwali-tv1">
<style>
  html,body{margin:0;padding:0;background:#0D1B2E;color:#fff;font-family:Tahoma,Arial,sans-serif;height:100%;overflow:hidden}
  #wrap{height:100%;display:block}
  .hdr{padding:14px 26px;border-bottom:1px solid rgba(255,255,255,.12);overflow:hidden}
  .hdr h1{margin:0;font-size:30px;float:right}
  #tvclock{position:fixed;top:14px;left:26px;z-index:20;font-size:24px;color:rgba(255,255,255,.6);direction:ltr}
  .spot{background:rgba(16,185,129,.14);border-bottom:1px solid rgba(52,211,153,.35);padding:18px 26px;overflow:hidden}
  .spot .lbl{float:right;font-size:28px;color:#6ee7b7;font-weight:bold;padding-top:26px}
  .spot .num{float:left;font-size:150px;line-height:1;color:#a7f3d0;font-weight:bold}
  .cols{overflow:hidden}
  .col{width:50%;float:right;box-sizing:border-box;padding:12px 18px}
  .tilebox{position:relative;overflow:hidden}
  .tiles{position:absolute;top:0;right:0;left:0;will-change:transform}
  .loopcopy{display:block}
  .loopsep{display:block;clear:both;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:14px 8px}
  .col h2{font-size:26px;margin:6px 0 12px}
  .ready h2{color:#6ee7b7}.prep h2{color:#fcd34d}
  .tile{display:inline-block;width:130px;height:110px;line-height:110px;text-align:center;font-size:52px;font-weight:bold;margin:6px;border-radius:16px;border:2px solid}
  .ready .tile{background:rgba(16,185,129,.15);border-color:rgba(52,211,153,.45);color:#d1fae5}
  .prep .tile{background:rgba(245,158,11,.12);border-color:rgba(251,191,36,.35);color:#fef3c7}
  .empty{color:rgba(255,255,255,.3);font-size:20px;padding:14px}
  .idle{text-align:center;padding-top:14%}
  .idle h1{font-size:56px;margin:0 0 10px}
  .idle p{font-size:22px;color:rgba(255,255,255,.4)}
  #audiobtn{position:fixed;bottom:14px;left:14px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:22px;padding:10px 18px;font-size:16px;font-family:inherit}
  #badge{position:fixed;bottom:14px;right:18px;color:rgba(255,255,255,.45);font-size:12px;text-align:left;opacity:.65}
  #badge .btxt{display:inline-block;vertical-align:middle;line-height:1.25}
  #bimg{height:26px;width:auto;vertical-align:middle;margin-right:8px}
  #hlogo{height:56px;width:auto;vertical-align:middle;margin-left:14px;object-fit:contain;background:transparent}
  #ilogo{height:120px;width:auto;display:block;margin:0 auto 24px;object-fit:contain;opacity:.9}
  #err{padding:40px;text-align:center;font-size:24px;color:#fca5a5}
  #dot{position:fixed;bottom:16px;left:50%;width:10px;height:10px;border-radius:50%;background:#34d399}
</style>
</head>
<body>
<div id="wrap"><div class="idle"><h1>جارٍ التحميل…</h1></div></div>
<div id="tvclock"></div>
<button id="audiobtn" style="display:none">اضغط لتفعيل الصوت</button>
<div id="badge"><div class="btxt">Powered by<br>Unify ERP · يونيفاي</div><img id="bimg" src="/__l5e/assets-v1/34e4d025-8d6d-4840-bd2b-cc410cc3f153/unify-mark-white.png" alt="Unify ERP"></div>
<div id="dot"></div>
<script>
(function(){
  var SB = "https://omwuyscprzexgmxgittp.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9td3V5c2NwcnpleGdteGdpdHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDEwMTIsImV4cCI6MjA4NjkxNzAxMn0.v-p6sK69OwTnPEFKNaESFQCf7BZREWzfFnr9Ux2ui-Y";

  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(window.location.search);return m?decodeURIComponent(m[1]):"";}
  function rpc(fn,body,cb){
    var x=new XMLHttpRequest();
    x.open("POST",SB+"/rest/v1/rpc/"+fn,true);
    x.setRequestHeader("Content-Type","application/json");
    x.setRequestHeader("apikey",KEY);
    x.setRequestHeader("Authorization","Bearer "+KEY);
    x.onreadystatechange=function(){
      if(x.readyState!==4)return;
      if(x.status>=200&&x.status<300){
        var d=null;try{d=JSON.parse(x.responseText);}catch(e){}
        cb(null,d);
      } else { cb(x.status+" "+x.responseText,null); }
    };
    x.onerror=function(){cb("network",null);};
    try{x.send(JSON.stringify(body));}catch(e){cb("send",null);}
  }

  var token=qs("token"), code=qs("code");
  var el=document.getElementById("wrap"), btn=document.getElementById("audiobtn"), dot=document.getElementById("dot");
  var companyName="", voiceTemplate="طلب رقم {n}", voiceLang="ar-PS", voiceMode="browser_tts", logoUrl="";
  var audioCache={};
  var played={}, sessionStart=new Date().getTime(), audioOk=false, ac=null;
  try{ var raw=localStorage.getItem("tv-played"); if(raw){var a=JSON.parse(raw);for(var i=0;i<a.length;i++)played[a[i]]=1;} }catch(e){}
  function remember(id){ played[id]=1; try{ var k=[];for(var p in played){if(played.hasOwnProperty(p))k.push(p);} localStorage.setItem("tv-played",JSON.stringify(k.slice(-200))); }catch(e){} }

  function unlock(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC){ if(!ac)ac=new AC(); if(ac.resume)ac.resume(); audioOk=(ac.state!=="suspended"); }
      else audioOk=true;
      if(window.speechSynthesis){ var u=new SpeechSynthesisUtterance(" "); window.speechSynthesis.speak(u); audioOk=true; }
    }catch(e){}
    btn.style.display=audioOk?"none":"block";
  }
  btn.onclick=unlock;
  document.addEventListener("click",unlock,false);
  document.addEventListener("keydown",unlock,false);
  document.addEventListener("touchstart",unlock,false);
  setTimeout(unlock,300);
  setInterval(function(){ if(!audioOk) btn.style.display="block"; },3000);

  function beep(){
    try{
      if(!ac)return;
      var o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=880; g.gain.value=0.25;
      o.connect(g); g.connect(ac.destination); o.start();
      setTimeout(function(){try{o.stop();}catch(e){}},250);
    }catch(e){}
  }
  function browserSpeak(num){
    setTimeout(function(){
      try{
        if(!window.speechSynthesis)return;
        var text=voiceTemplate.replace("{n}",num);
        var u=new SpeechSynthesisUtterance(text);
        u.lang=voiceLang||"ar"; u.rate=0.9; u.volume=1;
        window.speechSynthesis.speak(u);
      }catch(e){}
    },400);
  }
  // ElevenLabs cached MP3 (same voice as the main display). Falls back to browser TTS.
  function elevenSpeak(num){
    var cached=audioCache[num];
    if(cached){ playUrl(cached,num); return; }
    var x=new XMLHttpRequest();
    x.open("POST",SB+"/functions/v1/kds-generate-call-audio",true);
    x.setRequestHeader("Content-Type","application/json");
    x.setRequestHeader("apikey",KEY);
    x.setRequestHeader("Authorization","Bearer "+KEY);
    x.onreadystatechange=function(){
      if(x.readyState!==4)return;
      var d=null; try{ d=JSON.parse(x.responseText); }catch(e){}
      if(d&&d.audio_url){ audioCache[num]=d.audio_url; playUrl(d.audio_url,num); }
      else browserSpeak(num);
    };
    x.onerror=function(){ browserSpeak(num); };
    try{
      x.send(JSON.stringify({token:token,display_number:String(num),template:voiceTemplate,language:voiceLang}));
    }catch(e){ browserSpeak(num); }
  }
  function playUrl(url,num){
    try{
      var a=new Audio(url); a.volume=1;
      var p=a.play();
      if(p&&p["catch"])p["catch"](function(){ browserSpeak(num); });
    }catch(e){ browserSpeak(num); }
  }
  function speak(num){
    beep();
    if(voiceMode==="beep_only")return;
    if(voiceMode==="cached_arabic_audio"){ setTimeout(function(){ elevenSpeak(num); },400); return; }
    browserSpeak(num);
  }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  var lastRenderKey="";
  function render(orders){
    var renderParts=[companyName,logoUrl],ri;
    for(ri=0;orders&&ri<orders.length;ri++){
      renderParts.push(String(orders[ri].id||orders[ri].order_id||""),String(orders[ri].status||""),String(orders[ri].display_number||orders[ri].order_number||""));
    }
    var renderKey=renderParts.join("|");
    if(renderKey===lastRenderKey)return;
    lastRenderKey=renderKey;
    var lg=logoUrl?'<img id="ilogo" src="'+esc(logoUrl)+'" alt="">':'';
    if(!orders||!orders.length){
      el.innerHTML='<div class="idle">'+lg+'<h1>'+esc(companyName||"أهلاً وسهلاً")+'</h1><p>لا توجد طلبات حالياً</p></div>';
      return;
    }
    var ready=[],prep=[],i;
    for(i=0;i<orders.length;i++){ (orders[i].status==="ready"?ready:prep).push(orders[i]); }
    ready.sort(function(a,b){ return String(b.ready_at||b.created_at)<String(a.ready_at||a.created_at)?-1:1; });
    function num(o){ return esc(o.display_number||o.order_number||"—"); }
    var hl=logoUrl?'<img id="hlogo" src="'+esc(logoUrl)+'" alt="">':'';
    var h='<div class="hdr"><h1>'+hl+esc(companyName||"طلبات اليوم")+'</h1></div>';
    if(ready.length){ h+='<div class="spot"><div class="num">'+num(ready[0])+'</div><div class="lbl">آخر رقم جاهز</div></div>'; }
    h+='<div class="cols"><div class="col ready"><h2>جاهز للاستلام ('+ready.length+')</h2><div class="tilebox"><div class="tiles">';
    if(!ready.length)h+='<div class="empty">لا يوجد</div>';
    for(i=0;i<ready.length;i++)h+='<div class="tile">'+num(ready[i])+'</div>';
    h+='</div></div></div><div class="col prep"><h2>قيد التحضير ('+prep.length+')</h2><div class="tilebox"><div class="tiles">';
    if(!prep.length)h+='<div class="empty">لا يوجد</div>';
    for(i=0;i<prep.length;i++)h+='<div class="tile">'+num(prep[i])+'</div>';
    h+='</div></div></div></div>';
    el.innerHTML=h;
    setupScroll();
  }

  /* Continuous (endless) credits-style scroll for overflowing columns. */
  var scrollFrame=0, scrollStates=[];
  function setupScroll(){
    if(scrollFrame){
      (window.cancelAnimationFrame||window.webkitCancelAnimationFrame||clearTimeout)(scrollFrame);
      scrollFrame=0;
    }
    scrollStates=[];
    var boxes=el.getElementsByTagName("div"), list=[], j;
    for(j=0;j<boxes.length;j++){ if(boxes[j].className==="tilebox") list.push(boxes[j]); }
    for(j=0;j<list.length;j++){ (function(box){
      var inner=box.firstChild; if(!inner) return;
      var top=box.getBoundingClientRect().top;
      var h=Math.max(140,(window.innerHeight||600)-top-24);
      box.style.height=h+"px";
      var original=inner.innerHTML;
      var tileCount=inner.getElementsByTagName("div").length;
      inner.style.top="0px";
      inner.style.transform="translateY(0px)";
      inner.style.webkitTransform="translateY(0px)";
      if(tileCount<2) return;
      // Always loop multi-row lists, even when the last row barely fits.
      // This guarantees every number travels fully out at the top and returns
      // from the bottom, rather than only animating on detected overflow.
      inner.innerHTML='<div class="loopcopy">'+original+'</div><div class="loopsep"></div><div class="loopcopy">'+original+'</div>';
      var copies=inner.children, firstCopy=copies[0], secondCopy=copies[2];
      var cycle=(firstCopy&&secondCopy)?secondCopy.offsetTop-firstCopy.offsetTop:0;
      if(cycle<=0){ inner.innerHTML=original; return; }
      scrollStates.push({node:inner,cycle:cycle,started:new Date().getTime()});
    })(list[j]); }
    if(!scrollStates.length)return;
    var raf=window.requestAnimationFrame||window.webkitRequestAnimationFrame||function(fn){return setTimeout(fn,40);};
    function move(){
      var now=new Date().getTime(),i,pos,st;
      for(i=0;i<scrollStates.length;i++){
        st=scrollStates[i];
        pos=-(((now-st.started)*0.024)%st.cycle);
        st.node.style.transform="translateY("+pos+"px)";
        st.node.style.webkitTransform="translateY("+pos+"px)";
      }
      scrollFrame=raf(move);
    }
    scrollFrame=raf(move);
  }

  function fail(msg){ el.innerHTML='<div id="err">'+esc(msg)+'</div>'; }

  function loadOrders(){
    rpc("kds_get_active_orders",{_token:token},function(e,d){
      dot.style.background=e?"#f59e0b":"#34d399";
      if(e)return;
      render(d||[]);
    });
  }
  function loadCalls(){
    var since=new Date(new Date().getTime()-30*60*1000).toISOString();
    rpc("kds_recent_call_events",{_token:token,_since:since},function(e,d){
      if(e||!d)return;
      var pend=[],i;
      for(i=0;i<d.length;i++){
        var ev=d[i];
        if(played[ev.id])continue;
        if(new Date(ev.created_at).getTime()<sessionStart){ remember(ev.id); continue; }
        pend.push(ev);
      }
      if(pend.length>3)pend=pend.slice(pend.length-3);
      for(i=0;i<pend.length;i++){
        (function(ev,idx){
          remember(ev.id);
          if(!ev.display_number)return;
          if(!audioOk)return;
          setTimeout(function(){ speak(ev.display_number); }, idx*4000);
        })(pend[i],i);
      }
    });
  }
  function heartbeat(){ rpc("kds_device_heartbeat",{_token:token},function(){}); }
  function loadSettings(){
    rpc("kds_get_display_settings",{_token:token},function(e,d){
      if(e||!d)return;
      companyName=d.company_name||"";
      logoUrl=d.logo_url||"";
      // Malaky: use the bundled transparent logo instead of the stored one
      if(companyName.indexOf("الملكي")>-1){ logoUrl="/malaky-logo.png"; }
      if(d.pos_kds_voice_mode)voiceMode=d.pos_kds_voice_mode;
      if(d.pos_voice_template)voiceTemplate=d.pos_voice_template;
      if(d.pos_voice_language)voiceLang=d.pos_voice_language;
       // Settings may arrive after the first orders response; force one
       // branded render, then unchanged 4-second polls no longer reset scroll.
       lastRenderKey="";
       loadOrders();
    });
  }

  function start(){
    loadSettings(); loadOrders(); loadCalls(); heartbeat();
    setInterval(loadOrders,4000);
    setInterval(loadCalls,4000);
    setInterval(heartbeat,30000);
  }

  // The clock lives outside the orders container, so polling/rendering can
  // never replace it. Recursive timeout also avoids interval drift on old TVs.
  function tickClock(){
    var c=document.getElementById("tvclock");
    if(c)c.innerHTML=new Date().toLocaleTimeString();
    setTimeout(tickClock,250);
  }
  tickClock();

  if(token){ start(); }
  else if(code){
    rpc("kds_resolve_display_code_v2",{_code:code},function(e,d){
      if(e||!d||!d.token){ fail("الرابط غير صالح أو الجهاز غير مفعّل"); return; }
      token=d.token; start();
    });
  } else { fail("أضف ?code=... أو ?token=... للرابط"); }
})();
</script>
</body>
</html>
