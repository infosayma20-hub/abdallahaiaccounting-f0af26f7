<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة عرض الطلبات</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0D1B2E;color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
  #hdr{padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-size:28px;font-weight:bold}
  #spot{padding:16px 24px;border-bottom:1px solid rgba(52,211,153,.3);display:none}
  #spot .lbl{color:#6ee7b7;font-size:26px}
  #spotnum{color:#a7f3d0;font-size:140px;line-height:1;font-weight:bold;text-align:center}
  .cols{display:table;width:100%;table-layout:fixed}
  .col{display:table-cell;vertical-align:top;padding:12px}
  .ttl{font-size:26px;font-weight:bold;margin-bottom:10px}
  .ready .ttl{color:#6ee7b7}.prep .ttl{color:#fcd34d}
  .tile{display:inline-block;width:130px;height:110px;line-height:110px;text-align:center;
        font-size:56px;font-weight:bold;margin:6px;border-radius:14px;border:2px solid}
  .ready .tile{background:rgba(16,185,129,.15);border-color:rgba(52,211,153,.45);color:#d1fae5}
  .prep .tile{background:rgba(245,158,11,.12);border-color:rgba(252,211,77,.35);color:#fef3c7}
  .empty{color:rgba(255,255,255,.3);font-size:20px;padding:16px}
  #idle{text-align:center;padding-top:18%;display:none}
  #idle h1{font-size:56px;margin:0 0 10px}
  #idle p{color:rgba(255,255,255,.4);font-size:24px}
  #err{color:#fca5a5;font-size:22px;text-align:center;padding:40px;display:none}
</style>
</head>
<body>
<div id="err"></div>
<div id="idle"><h1 id="idleName">أهلاً وسهلاً</h1><p>لا توجد طلبات حالياً</p></div>
<div id="board" style="display:none">
  <div id="hdr">طلبات اليوم</div>
  <div id="spot"><div class="lbl">آخر رقم جاهز</div><div id="spotnum"></div></div>
  <div class="cols">
    <div class="col ready"><div class="ttl">جاهز للاستلام</div><div id="readyList"></div></div>
    <div class="col prep"><div class="ttl">قيد التحضير</div><div id="prepList"></div></div>
  </div>
</div>
<script>
(function(){
  var SB = "https://omwuyscprzexgmxgittp.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9td3V5c2NwcnpleGdteGdpdHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDEwMTIsImV4cCI6MjA4NjkxNzAxMn0.v-p6sK69OwTnPEFKNaESFQCf7BZREWzfFnr9Ux2ui-Y";
  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(window.location.search);return m?decodeURIComponent(m[1]):"";}
  var token = qs("token");
  var elErr=document.getElementById("err"), elIdle=document.getElementById("idle"),
      elBoard=document.getElementById("board"), elSpot=document.getElementById("spot"),
      elSpotNum=document.getElementById("spotnum"), elReady=document.getElementById("readyList"),
      elPrep=document.getElementById("prepList"), elHdr=document.getElementById("hdr"),
      elIdleName=document.getElementById("idleName");

  function rpc(fn, body, cb){
    var x = new XMLHttpRequest();
    x.open("POST", SB + "/rest/v1/rpc/" + fn, true);
    x.setRequestHeader("Content-Type","application/json");
    x.setRequestHeader("apikey", KEY);
    x.setRequestHeader("Authorization","Bearer " + KEY);
    x.onreadystatechange = function(){
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var d = null; try { d = JSON.parse(x.responseText); } catch(e){}
        cb(null, d);
      } else { cb(x.status + " " + x.responseText, null); }
    };
    x.send(JSON.stringify(body));
  }

  function show(el, on){ el.style.display = on ? "block" : "none"; }

  function tiles(list){
    if (!list.length) return '<div class="empty">لا يوجد</div>';
    var h = "";
    for (var i=0;i<list.length;i++){
      var n = list[i].display_number || list[i].order_number || "—";
      h += '<div class="tile">' + n + '</div>';
    }
    return h;
  }

  function render(rows){
    var ready=[], prep=[], i;
    for (i=0;i<rows.length;i++){
      if (rows[i].status === "ready") ready.push(rows[i]);
      else if (rows[i].status === "preparing") prep.push(rows[i]);
    }
    ready.sort(function(a,b){
      var x=(a.ready_at||a.created_at), y=(b.ready_at||b.created_at);
      return x<y?1:(x>y?-1:0);
    });
    if (!rows.length){ show(elIdle,true); show(elBoard,false); return; }
    show(elIdle,false); show(elBoard,true);
    if (ready.length){
      show(elSpot,true);
      elSpotNum.innerHTML = ready[0].display_number || ready[0].order_number || "";
    } else { show(elSpot,false); }
    elReady.innerHTML = tiles(ready);
    elPrep.innerHTML = tiles(prep);
  }

  function load(){
    if (!token){ elErr.innerHTML = "لا يوجد توكن جهاز. أضف ?token=... للرابط."; show(elErr,true); return; }
    rpc("kds_get_active_orders", { _token: token }, function(err, data){
      if (err){ elErr.innerHTML = "تعذر الاتصال — إعادة المحاولة…"; show(elErr,true); return; }
      show(elErr,false);
      render(data || []);
    });
  }

  function settings(){
    if (!token) return;
    rpc("kds_get_display_settings", { _token: token }, function(err, d){
      if (err || !d) return;
      if (d.company_name){ elHdr.innerHTML = d.company_name; elIdleName.innerHTML = d.company_name; }
    });
  }
  function beat(){ if (token) rpc("kds_device_heartbeat", { _token: token }, function(){}); }

  settings(); load(); beat();
  setInterval(load, 5000);
  setInterval(beat, 30000);
  // Reload once an hour to clear any memory build-up on old TV browsers
  setTimeout(function(){ window.location.reload(); }, 3600000);
})();
</script>
</body>
</html>
