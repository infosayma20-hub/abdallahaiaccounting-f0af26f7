    <div id="root"></div>
    <script>
      // Stale-chunk recovery: when the browser holds an old index.html that
      // references hashed bundles which no longer exist (HTTP 500 / 404 on
      // /assets/*.js), we hard-clear caches + SW and reload once.
      (function () {
        var RECOVERY_KEY = "amwali_chunk_recovery_ts";
        var COOLDOWN_MS = 60 * 1000;

        function isInternalRecoveryParam(key) {
          return key === "__recover" || key === "__hard" || key === "__refresh" || key === "sw-cleanup" || key === "v" || key === "t";
        }

        function cleanRecoveryUrl() {
          try {
            var clean = new URL(window.location.href);
            var changed = false;
            Array.from(clean.searchParams.keys()).forEach(function (key) {
              if (isInternalRecoveryParam(key)) {
                clean.searchParams.delete(key);
                changed = true;
              }
            });
            if (changed) window.history.replaceState({}, "", clean.pathname + clean.search + clean.hash);
          } catch (e) {}
        }

        function isAppServiceWorkerRegistration(reg) {
          try {
            var script = (reg && reg.active && reg.active.scriptURL) || (reg && reg.installing && reg.installing.scriptURL) || (reg && reg.waiting && reg.waiting.scriptURL) || "";
            return script.indexOf("/sw.js") !== -1 || script.indexOf("/service-worker.js") !== -1;
          } catch (e) {
            return false;
          }
        }

        function isAppCacheName(name) {
          return /(^|-)precache-v\d+-|(^|-)runtime-|(^|-)googleAnalytics-/.test(name) || name.indexOf("workbox") !== -1;
        }

        async function clearAppShellCacheAndWorkers() {
          try {
            if (window.caches && caches.keys) {
              var ks = await caches.keys();
              await Promise.all(ks.filter(isAppCacheName).map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.filter(isAppServiceWorkerRegistration).map(function (r) { return r.unregister().catch(function () {}); }));
            }
          } catch (e) {}
        }

        // On boot: if the URL carries __recover, make sure no Service Worker
        // is still controlling this page (it may be serving the stale HTML
        // that referenced the dead bundle). If so, unregister + clear caches
        // and do ONE more hard reload bypassing SW so the next navigation
        // gets a fresh document from the network.
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has("__recover")) {
            var BOOT_KEY = "amwali_recover_boot_ts";
            var lastBoot = Number(sessionStorage.getItem(BOOT_KEY) || "0");
            if (Date.now() - lastBoot > 10 * 1000 && navigator.serviceWorker && navigator.serviceWorker.controller) {
              sessionStorage.setItem(BOOT_KEY, String(Date.now()));
              (async function () {
                await clearAppShellCacheAndWorkers();
                window.location.replace(u.pathname + u.hash);
              })();
              return;
            }
            // Already controller-free — strip the marker after a short delay
            // so a successful boot leaves a clean URL.
            setTimeout(function () {
              try {
                if (document.getElementById("root") && document.getElementById("root").childElementCount > 0) {
                  cleanRecoveryUrl();
                }
              } catch (e) {}
            }, 4000);
          }
        } catch (e) {}

        // If React boots normally after any recovery/update navigation, remove
        // internal rescue markers so staff never keep sharing scary URLs.
        setTimeout(function () {
          try {
            if (document.getElementById("root") && document.getElementById("root").childElementCount > 0) cleanRecoveryUrl();
          } catch (e) {}
        }, 5000);

        // Stuck-blank safety net disabled — silent auto-recovery only via
        // the chunk-error handler below. We never surface a manual panel
        // because it scared cashiers on slow networks where React loads in
        // 9–15s. If something is truly broken the error handler triggers
        // recover() which clears SW + caches and reloads once.

        function shouldRecover(msg, src) {
          if (!msg && !src) return false;
          var m = (msg || "") + " " + (src || "");
          return (
            m.indexOf("Importing a module script failed") !== -1 ||
            m.indexOf("Failed to fetch dynamically imported module") !== -1 ||
            m.indexOf("error loading dynamically imported module") !== -1 ||
            (m.indexOf("/assets/") !== -1 &&
              (m.indexOf(".js") !== -1 || m.indexOf(".css") !== -1))
          );
        }

        async function recover() {
          try {
            var last = Number(sessionStorage.getItem(RECOVERY_KEY) || "0");
            if (Date.now() - last < COOLDOWN_MS) return;
            sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));
          } catch (e) {}
          await clearAppShellCacheAndWorkers();
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("__recover", String(Date.now()));
            window.location.replace(url.toString());
          } catch (e) {
            window.location.reload();
          }
        }

        window.addEventListener(
          "error",
          function (ev) {
            var target = ev && ev.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              var src = target.src || target.href || "";
              if (shouldRecover("", src)) recover();
              return;
            }
            if (ev && shouldRecover(ev.message, ev.filename)) recover();
          },
          true
        );

        window.addEventListener("unhandledrejection", function (ev) {
          var reason = ev && ev.reason;
          var msg = reason && (reason.message || String(reason));
          if (shouldRecover(msg, "")) recover();
        });
      })();
