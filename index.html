  <body>
    <div id="root"></div>
    <script>
      // Stale-chunk recovery: when the browser holds an old index.html that
      // references hashed bundles which no longer exist (HTTP 500 / 404 on
      // /assets/*.js), we hard-clear caches + SW and reload once.
      (function () {
        var RECOVERY_KEY = "amwali_chunk_recovery_ts";
        var COOLDOWN_MS = 60 * 1000;

        // On boot: if the URL carries __recover, make sure no Service Worker
        // is still controlling this page (it may be serving the stale HTML
        // that referenced the dead bundle). If so, unregister + clear caches
        // and do ONE more hard reload bypassing SW so the next navigation
        // gets a fresh document from the network.
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has("__recover")) {
            var BOOT_KEY = "amwali_recover_boot_ts";
            var lastBoot = Number(sessionStorage.getItem(BOOT_KEY) || "0");
            if (Date.now() - lastBoot > 10 * 1000 && navigator.serviceWorker && navigator.serviceWorker.controller) {
              sessionStorage.setItem(BOOT_KEY, String(Date.now()));
              (async function () {
                try {
                  if (window.caches && caches.keys) {
                    var ks = await caches.keys();
                    await Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }
                  var regs = await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
                } catch (e) {}
                window.location.replace(u.pathname + u.hash);
              })();
              return;
            }
            // Already controller-free — strip the marker after a short delay
            // so a successful boot leaves a clean URL.
            setTimeout(function () {
              try {
                if (document.getElementById("root") && document.getElementById("root").childElementCount > 0) {
                  var clean = new URL(window.location.href);
                  clean.searchParams.delete("__recover");
                  window.history.replaceState({}, "", clean.pathname + clean.search + clean.hash);
                }
              } catch (e) {}
            }, 4000);
          }
        } catch (e) {}

        // ── Stuck-blank safety net ──────────────────────────────────────────
        // If after 8s the React root is still empty, surface a visible
        // recovery panel instead of leaving the user on a blank white page.
        // Triggers a one-shot full wipe (SW + caches) + reload bypassing SW.
        setTimeout(function () {
          try {
            var root = document.getElementById("root");
            if (root && root.childElementCount === 0) {
              var panel = document.createElement("div");
              panel.dir = "rtl";
              panel.style.cssText =
                "position:fixed;inset:0;z-index:2147483647;background:#0D1B2E;color:#fff;" +
                "display:flex;align-items:center;justify-content:center;padding:24px;" +
                "font-family:Cairo,system-ui,-apple-system,sans-serif;";
              panel.innerHTML =
                '<div style="max-width:420px;width:100%;text-align:center;line-height:1.7">' +
                '<div style="font-size:22px;font-weight:700;margin-bottom:12px">تعذّر تشغيل أموالي على هذا الجهاز</div>' +
                '<div style="opacity:.85;margin-bottom:20px;font-size:14px">في نسخة قديمة محفوظة بالمتصفح. اضغط الزر لتنظيفها وإعادة التحميل.</div>' +
                '<button id="__amwali_fix_btn" style="background:#fff;color:#0D1B2E;border:0;border-radius:10px;padding:12px 24px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">تنظيف وإعادة التشغيل</button>' +
                '<div style="opacity:.5;margin-top:18px;font-size:11px;font-family:monospace">amwali recovery</div>' +
                "</div>";
              document.body.appendChild(panel);
              var btn = document.getElementById("__amwali_fix_btn");
              if (btn) btn.addEventListener("click", async function () {
                btn.innerText = "جارٍ التنظيف...";
                try {
                  if (window.caches && caches.keys) {
                    var kk = await caches.keys();
                    await Promise.all(kk.map(function (k) { return caches.delete(k); }));
                  }
                  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                    var rr = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(rr.map(function (r) { return r.unregister().catch(function () {}); }));
                  }
                  try {
                    Object.keys(localStorage).forEach(function (k) {
                      if (k.indexOf("workbox") === 0 || k.indexOf("amwali_chunk_recovery") === 0 || k.indexOf("amwali_recover_boot") === 0) {
                        localStorage.removeItem(k);
                      }
                    });
                  } catch (e) {}
                } catch (e) {}
                var cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.delete("__recover");
                cleanUrl.searchParams.set("__hard", String(Date.now()));
                window.location.replace(cleanUrl.toString());
              });
            }
          } catch (e) {}
        }, 8000);

        function shouldRecover(msg, src) {
          if (!msg && !src) return false;
          var m = (msg || "") + " " + (src || "");
          return (
            m.indexOf("Importing a module script failed") !== -1 ||
            m.indexOf("Failed to fetch dynamically imported module") !== -1 ||
            m.indexOf("error loading dynamically imported module") !== -1 ||
            (m.indexOf("/assets/") !== -1 &&
              (m.indexOf(".js") !== -1 || m.indexOf(".css") !== -1))
          );
        }

        async function recover() {
          try {
            var last = Number(sessionStorage.getItem(RECOVERY_KEY) || "0");
            if (Date.now() - last < COOLDOWN_MS) return;
            sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
            }
          } catch (e) {}
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("__recover", String(Date.now()));
            window.location.replace(url.toString());
          } catch (e) {
            window.location.reload();
          }
        }

        window.addEventListener(
          "error",
          function (ev) {
            var target = ev && ev.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              var src = target.src || target.href || "";
              if (shouldRecover("", src)) recover();
              return;
            }
            if (ev && shouldRecover(ev.message, ev.filename)) recover();
          },
          true
        );

        window.addEventListener("unhandledrejection", function (ev) {
          var reason = ev && ev.reason;
          var msg = reason && (reason.message || String(reason));
          if (shouldRecover(msg, "")) recover();
        });
      })();
    </script>
